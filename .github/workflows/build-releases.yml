name: Build GUI releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows-build:
    name: Build Windows executable
    # TODO: switch back to [self-hosted, Windows, X64] once a self-hosted
    # Windows runner is registered for this repo. windows-latest gives a
    # HEADLESS smoke test only (no GPU/display).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PyInstaller build
        uses: actions/cache@v5
        with:
          path: build/
          key: pyinstaller-win-${{ hashFiles('pysimplemask.spec', 'packaging/entrypoint.py') }}
          restore-keys: |
            pyinstaller-win-

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pyinstaller]"

      - name: Build executable
        run: pyinstaller pysimplemask.spec

      - name: Rename executable with version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version_tag }}"
          mv dist/pySimpleMask.exe "dist/pySimpleMask-${TAG}-windows.exe"

      - name: Smoke test executable launches
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $TAG = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $env:VERSION_TAG }
          $exe = Get-ChildItem dist -Filter "pySimpleMask-*-windows.exe" | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in dist/" }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "Executable exited early with code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Executable is running after 8s, smoke test passed"
          Stop-Process -Id $proc.Id -Force

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/pySimpleMask-*-windows.exe
          retention-days: 14

  linux-appimage-build:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          dnf install -y python3.11 python3.11-pip \
            mesa-libGL mesa-libEGL libxkbcommon libxkbcommon-x11 \
            xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil \
            dbus-libs fontconfig freetype file

      - name: Cache PyInstaller build
        uses: actions/cache@v5
        with:
          path: build/
          key: pyinstaller-linux-${{ hashFiles('pysimplemask.spec', 'packaging/entrypoint.py') }}
          restore-keys: |
            pyinstaller-linux-

      - name: Install project and PyInstaller
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -e ".[pyinstaller]"

      - name: Build AppImage
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version_tag }}"
          bash packaging/linux/build-appimage.sh "$TAG"

      - name: Smoke test AppImage launches
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMAGE=$(ls dist/pySimpleMask-*-x86_64.AppImage 2>/dev/null || echo "")
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found"
            ls -la dist/
            exit 1
          fi
          chmod +x "$APPIMAGE"
          timeout 8 "$APPIMAGE" --appimage-extract-and-run > /tmp/run.log 2>&1 &
          RPID=$!
          sleep 6
          if kill -0 $RPID 2>/dev/null; then
            echo "Smoke test passed: AppImage is running after 6s"
            kill $RPID
          else
            wait $RPID || true
            echo "Smoke test FAILED: AppImage exited early"
            cat /tmp/run.log
            exit 1
          fi

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/pySimpleMask-*-x86_64.AppImage
          retention-days: 14

  macos-build:
    name: Build, sign, and notarize macOS app
    runs-on: macos-14
    environment: macos-signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PyInstaller build
        uses: actions/cache@v5
        with:
          path: build/
          key: pyinstaller-macos-${{ hashFiles('pysimplemask.spec', 'packaging/entrypoint.py') }}
          restore-keys: |
            pyinstaller-macos-

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pyinstaller]"

      - name: Generate .icns app icon
        run: bash packaging/macos/make_icns.sh

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" \
              | head -1 \
              | awk '{print $2}'
          )"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::Developer ID Application identity not found"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build application
        run: pyinstaller pysimplemask.spec

      - name: Sign application bundle
        run: |
          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            "dist/pySimpleMask.app"

      - name: Verify application signature
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/pySimpleMask.app"
          codesign --display --verbose=4 "dist/pySimpleMask.app"

      - name: Notarize and staple app bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "dist/pySimpleMask.app" "dist/pySimpleMask.zip"

          xcrun notarytool submit "dist/pySimpleMask.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "dist/pySimpleMask.app"
          rm -f "dist/pySimpleMask.zip"

      - name: Smoke test app launches
        run: |
          "dist/pySimpleMask.app/Contents/MacOS/pySimpleMask" &
          APP_PID=$!
          sleep 8
          if kill -0 $APP_PID 2>/dev/null; then
            echo "Smoke test passed: app is running after 8s"
            kill $APP_PID
          else
            wait $APP_PID || true
            echo "Smoke test FAILED: app exited early"
            exit 1
          fi

      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R "dist/pySimpleMask.app" dmg-root/
          ln -s /Applications dmg-root/Applications

          hdiutil create \
            -volname "pySimpleMask" \
            -srcfolder dmg-root \
            -format UDZO \
            -ov \
            "dist/pySimpleMask.dmg"

      - name: Sign DMG
        run: |
          codesign \
            --force \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "dist/pySimpleMask.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "dist/pySimpleMask.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "dist/pySimpleMask.dmg"
          xcrun stapler validate "dist/pySimpleMask.dmg"

      - name: Check Gatekeeper
        run: |
          spctl \
            --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "dist/pySimpleMask.dmg"

      - name: Rename DMG with version
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version_tag }}"
          mv "dist/pySimpleMask.dmg" "dist/pySimpleMask-${TAG}-macos.dmg"

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/pySimpleMask-*-macos.dmg
          retention-days: 14

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  github-release:
    name: Publish GitHub Release
    needs: [windows-build, linux-appimage-build, macos-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: dist/

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: dist/

      - name: Download macOS dmg artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dist/

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "pySimpleMask ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/pySimpleMask-*-windows.exe
            dist/pySimpleMask-*-x86_64.AppImage
            dist/pySimpleMask-*-macos.dmg